seed: 42
python_hashseed: 42
env:
  PYTHONUTF8: "1"
  PYTHONHASHSEED: "42"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  TOKENIZERS_PARALLELISM: "false"
  HF_HUB_OFFLINE: "1"
paths:
  raw: data-raw/twcs.csv
  cache: cache/
  manifests: manifests/
  sample: data-sample/sample.csv
  results: results/
  report: report/
  eval_parquet: data-sample/eval_200.parquet
  index: cache/faiss.index
  meta: cache/meta.json
  manifest_sha: cache/MANIFEST.sha256
temporal:
  cut: "2017-10-15T00:00:00Z"
  gap_hours: 24
  train_rule: "thread_start < cut"
  golden_rule: "thread_start >= cut"
  assert: "max(train.created_at) + 24h < min(golden.created_at)"
  max_span_hours: 48
  max_gap_hours: 24
  max_nominal_turns: 8
dedup:
  exact: sha256-normalized-lower
  minhash:
    lib: datasketch
    num_perm: 128
    shingle: char-5gram
    threshold_freeze: 0.85
    threshold_sample: 0.8
    seed: 42
  tfidf_verify:
    cosine_freeze: 0.85
    cosine_flag_sample: 0.9
lid:
  model: cache/lid.176.ftz
  url: https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.ftz
  bytes: 938013
  keep_threshold: 0.65
  audit_lo: 0.5
  audit_hi: 0.75
  audit_n: 200
retrieval:
  rrf_k: 60
  mmr_lambda: 0.7
  tie_break: sorted-doc-id
  bm25: {k1: 0.8, b: 0.4, k1_grid: [0.6, 0.8, 1.0], b_grid: [0.3, 0.4, 0.5]}
  tokenizer: {lowercase_text_only: true, keep_codes: true, keep_emoji_hashtag: true, stem_text_only: true}
  top_k: {sparse: 50, dense: 50, fused: 20, rerank_depth: 10, final: 3}
  rerank: {model: cross-encoder/ms-marco-MiniLM-L-6-v2, batch_size: 16, trunc: 512, depth_in: 10, depth_out: 3}
  thresholds: {top_score: 0.35, backoff_min_hits: 3, mmr_skip_pairwise: 0.92}
  boosts: {intent: 0.2, date: 0.05, date_decay: 0.15, lang: 0.03}
  corpus: {split: train, turns: inbound-only, brand: AmazonHelp}
  models:
    default: {hf_id: sentence-transformers/all-MiniLM-L6-v2, dim: 384, normalize: true}
    ablation: {hf_id: BAAI/bge-small-en-v1.5, dim: 384, query_prefix: 'Represent this sentence for searching relevant passages: ', queries_only: true}
brand:
  allowlist:
    - AmazonHelp
  primary_handle: thoughtvector/customer-support-on-twitter/versions/10
intent:
  taxonomy: [account-security, cancel-modify, returns-refunds, payment-promo,
    shipping-tracking, order-status, device-tech, product-info,
    complaint-feedback, other]
  stratifier: {name: heur-pseudo-stratifier, version: heur-v1.2.0}
  golden: {n_total: 200, n_random: 170, n_hard: 30, min_per_intent: 12, cap_per_intent: 30}
  pilot: {n: 50, seed: 43, kappa_gate: 0.6, kappa_lower_ci_gate: 0.4}
  t1: {max_features: 20000, min_df: 5, C: 4.0, class_weight: balanced, solver: lbfgs, max_iter: 500}
  temp_grid: [0.1, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.25, 2.5, 2.75, 3.0]
  ece_bins: 10
  t2: {model: sentence-transformers/all-MiniLM-L6-v2, dim: 384, ablation: bge-small-en-v1.5}
  oos: {method: energy-only, no_mahalanobis: true}
generation:
  model: gemini-2.5-flash
  temp: 0.2
  response_mime_type: application/json
  prompt_version: s4.1-v1.0.0
  body_max_chars: 240
  fit_max_chars: 280
  fit_reserve_chars: 10
  thresholds: {ret_score_min: 0.30, contra_max: 0.6}
  nli: {model: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli, swap: cross-encoder/nli-MiniLM2-L6-H768, entail_min: 0.2, scope: tie-break-only, splitter: splitter@v1.0.0}
  grounding: {tier_v_cite: required, tier_b_exempt_template: DM-request}
  blocklist_refund:
    - guaranteed refund
    - will refund you
    - refund approved
    - 100% refund
    - instant refund
  hedge_template: "eligible for review under policy; can't guarantee outcome; track in app, agent will confirm."
  verifier: {model: openai/gpt-oss-20b, prompt_version: verifier-v1.2.0-gptoss20b-low-20260911, scope: high-tier-only, on_reject: escalate-hedge}
escalation:
  confidence_min: 0.75
  abstain_target: [0.08, 0.15]
  risk: {conf_weight: 0.7, ground_weight: 0.3, pen_per_hard_hit: 0.2, pen_pii: 0.3, pen_low_retrieval: 0.2, pen_max: 0.5, low_retrieval_lt: 0.35}
  hard_gates: [HUM, LEG, PRI, SAF, FIN]
  tiers:
    high: {auto_below: 0.25, escalate_above: 0.45}
    med: {auto_below: 0.35, escalate_above: 0.60}
    low: {auto_below: 0.45, escalate_above: 0.70}
  note: "INIT operating points only - final swept on val ROC/ECE (S4.4)"
